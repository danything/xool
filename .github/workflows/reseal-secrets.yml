name: Reseal secrets

# 平文の値は GitHub Secrets 側にだけ置く。danything/bootstrap/.github/actions/kubeseal
# が、そこに同梱の公開鍵証明書(pub-cert.pem)で kubeseal し、結果の SealedSecret だけを
# コミットする。値を変えたら Secrets を更新してこのワークフローを再実行する
# (経緯は danything/bootstrap の README 参照)。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Seal xool-secrets
        uses: danything/bootstrap/.github/actions/kubeseal@main
        with:
          namespace: xool
          name: xool-secrets
          output-file: k3s/secret.yaml
          data: |
            {
              "client-id": ${{ toJSON(secrets.CLIENT_ID) }},
              "client-secret": ${{ toJSON(secrets.CLIENT_SECRET) }},
              "x-bearer-token": ${{ toJSON(secrets.X_BEARER_TOKEN) }},
              "hash": ${{ toJSON(secrets.HASH) }}
            }

      - name: Commit and push
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k3s/secret.yaml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: reseal xool-secrets"
          git push
