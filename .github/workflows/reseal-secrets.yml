name: Reseal secrets

# 平文の値は GitHub Secrets 側にだけ置く。k3s/pub-cert.pem (sealed-secrets
# コントローラーの公開鍵、非秘密なのでコミット済み) で kubeseal し、結果の
# SealedSecret だけをコミットする。値を変えたら Secrets を更新してこの
# ワークフローを再実行する。鍵のローテーションは bootstrap/fetch-cert.sh 参照。
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Seal xool-secrets
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          HASH: ${{ secrets.HASH }}
        run: |
          set -eu
          if ! command -v kubeseal >/dev/null 2>&1; then
            curl -sfL "https://github.com/bitnami/sealed-secrets/releases/download/v0.38.4/kubeseal-0.38.4-linux-amd64.tar.gz" \
              | tar -xz -C /tmp kubeseal
            sudo install -m 0755 /tmp/kubeseal /usr/local/bin/kubeseal
          fi

          kubectl create secret generic xool-secrets \
            --namespace xool \
            --from-literal=client-id="$CLIENT_ID" \
            --from-literal=client-secret="$CLIENT_SECRET" \
            --from-literal=x-bearer-token="$X_BEARER_TOKEN" \
            --from-literal=hash="$HASH" \
            --dry-run=client -o yaml \
          | kubeseal --cert k3s/pub-cert.pem --format yaml \
          > k3s/secret.yaml

      - name: Open PR with resealed secret
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git add k3s/secret.yaml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          # main requires the "build" status check, which the workflow's own
          # token can't satisfy on a direct push -- open a PR instead so build
          # runs and a human merges it.
          BRANCH="reseal-xool-secrets-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore: reseal xool-secrets"
          git push origin "$BRANCH"
          gh pr create --title "chore: reseal xool-secrets" \
            --body "Automated reseal from this repo's GitHub Secrets (reseal-secrets.yml)." \
            --base main --head "$BRANCH"
