services:
  xool:
    build:
      target: base
    volumes:
      - .:/usr/src/app
    command: dev
    networks:
      - proxy
      - default
    environment:
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - CLIENT_ID=
      - CLIENT_SECRET=
      - HASH=
      - ADMIN_X_IDS=
    labels:
      caddy: x.localhost, l.localhost
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  proxy:
    external: true
