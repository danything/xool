apiVersion: apps/v1
kind: Deployment
metadata:
  name: xool
  namespace: xool
  annotations:
    # 参照している Secret を Infisical operator が同期したら、自動でローリング再起動する
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  # Bring the replacement up and let it pass its readiness probe before the old
  # pod goes away, so the site never drops to zero serving pods. The images and
  # database PVCs are ReadWriteOnce, but local-path pins them to a node and the
  # scheduler follows, so both pods land there and can mount them together.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Hold the new pod ready for a moment before retiring the old one, so a pod
  # that starts and immediately falls over doesn't take the old one with it.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: xool
  template:
    metadata:
      labels:
        app: xool
    spec:
      # The volumes are created by whichever uid the image ran as at the time,
      # and that moved from 999 to 1000 when the base image went to Bun 1.4 --
      # which left the database directory unwritable by the container that owns
      # it. Naming the group here has the kubelet line the volumes up on mount,
      # so the next time it moves nothing has to be fixed by hand on the node.
      # OnRootMismatch skips the walk when the top-level directory already
      # matches, rather than re-chowning every image on every start.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # preStop (5s) + SHUTDOWN_TIMEOUT (30s, honoured by server.js), plus room.
      terminationGracePeriodSeconds: 45
      containers:
        - name: xool
          image: ghcr.io/danything/xool:ba55c1c950bc4444e4245667b806e1a88c46e90d
          ports:
            - containerPort: 3000
          # Endpoint removal and SIGTERM race each other. Sleeping first lets
          # Traefik stop routing here before the server stops accepting, so
          # in-flight clicks aren't answered with a connection reset.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 6
          env:
            # The origin comes from the request rather than a fixed ORIGIN, so
            # that this works the same behind Traefik as it does locally.
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
            # Who can open /admin. Named here rather than stored in the database
            # so that nobody can grant it to themselves by signing up. Empty
            # means nobody.
            - name: ADMIN_X_IDS
              value: "1021006412715921410"
            # Read by server.js: finish serving in-flight requests before
            # exiting. Must stay under terminationGracePeriodSeconds above.
            - name: SHUTDOWN_TIMEOUT
              value: "30"
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-secret
            - name: HASH
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: hash
            # App-only, and only for GET /2/usage/tweets -- the endpoint refuses
            # both the user tokens this app stores and the credentials it signs
            # people in with. Optional: without it the admin page simply has no
            # column to check itself against.
            - name: X_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: x-bearer-token
                  optional: true
          volumeMounts:
            - name: xool-db
              mountPath: /usr/src/app/data
            - name: xool-assets
              mountPath: /usr/src/app/build/client/_app/immutable
      volumes:
        - name: xool-db
          persistentVolumeClaim:
            claimName: xool-db
        - name: xool-assets
          persistentVolumeClaim:
            claimName: xool-assets
