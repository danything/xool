apiVersion: apps/v1
kind: Deployment
metadata:
  name: xool
  namespace: xool
spec:
  replicas: 1
  # Bring the replacement up and let it pass its readiness probe before the old
  # pod goes away, so the site never drops to zero serving pods. The images and
  # database PVCs are ReadWriteOnce, but local-path pins them to a node and the
  # scheduler follows, so both pods land there and can mount them together.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Hold the new pod ready for a moment before retiring the old one, so a pod
  # that starts and immediately falls over doesn't take the old one with it.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: xool
  template:
    metadata:
      labels:
        app: xool
    spec:
      # preStop (5s) + SHUTDOWN_TIMEOUT (30s, honoured by server.js), plus room.
      terminationGracePeriodSeconds: 45
      containers:
        - name: xool
          image: ghcr.io/danything/xool:ad633b23e1bbfd75075492495b4aac5d83eb078c
          ports:
            - containerPort: 3000
          # Endpoint removal and SIGTERM race each other. Sleeping first lets
          # Traefik stop routing here before the server stops accepting, so
          # in-flight clicks aren't answered with a connection reset.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 6
          env:
            # No fixed ORIGIN: this pod serves two hostnames, so the origin has
            # to come from the request. Traefik sets both of these headers.
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
            # The hostname LGTM answers on. Anything else is the summary tool.
            - name: LGTM_HOST
              value: l.doany.io
            # Who can open /admin. Named here rather than stored in the database
            # so that nobody can grant it to themselves by signing up. Empty
            # means nobody.
            - name: ADMIN_X_IDS
              value: "1021006412715921410"
            - name: ADMIN_GH_LOGINS
              value: "5ym"
            # Read by server.js: finish serving in-flight requests before
            # exiting. Must stay under terminationGracePeriodSeconds above.
            - name: SHUTDOWN_TIMEOUT
              value: "30"
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: client-secret
            - name: HASH
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: hash
            # optional until the sealed secret carries them: without it a pod
            # rolled out before the GitHub app exists cannot start at all, and
            # the only thing that stops working is LGTM's sign-in.
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: github-client-id
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: xool-secrets
                  key: github-client-secret
                  optional: true
          volumeMounts:
            - name: xool-images
              mountPath: /usr/src/app/images
            - name: xool-db
              mountPath: /usr/src/app/data
            - name: xool-assets
              mountPath: /usr/src/app/build/client/_app/immutable
      volumes:
        - name: xool-images
          persistentVolumeClaim:
            claimName: xool-images
        - name: xool-db
          persistentVolumeClaim:
            claimName: xool-db
        - name: xool-assets
          persistentVolumeClaim:
            claimName: xool-assets
