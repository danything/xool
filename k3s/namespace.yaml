# 消す前の1段目。ArgoCD は追跡から外れたリソースを prune するが、Namespace の
# 削除は中の PVC ごと巻き込む。先に「消すな」の印を実物に付けてから、次で
# このファイルを外す (CreateNamespace=true が argocd.yaml の namespace を作るので、
# 素の Namespace は要らない)
apiVersion: v1
kind: Namespace
metadata:
  name: xool
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
