apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xool
  namespace: xool
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: mydnschallenge
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - x.doany.io
        - l.doany.io
  rules:
    # One Deployment answers both names. Which tool a request gets is decided in
    # the app from the Host header, so both names route everything to the same
    # place and the rules differ only in the name itself.
    - host: x.doany.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xool
                port:
                  number: 3000
    - host: l.doany.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xool
                port:
                  number: 3000
