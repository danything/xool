apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xool
  namespace: xool
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: mydnschallenge
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - x.doany.io
  rules:
    # LGTM answers on its own name from its own deployment now, in the lgtm
    # namespace. Leaving it listed here as well had Traefik holding two rules
    # for l.doany.io and picking between them per request, so a sign-in could
    # land on whichever app it felt like.
    - host: x.doany.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xool
                port:
                  number: 3000
