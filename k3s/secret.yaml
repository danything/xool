# Encrypted against this cluster's sealed-secrets controller, and scoped to
# this namespace and name -- the ciphertext is useless anywhere else, which is
# what makes it safe to commit. To change a value: update this repo's GitHub
# Secrets and run .github/workflows/reseal-secrets.yml (workflow_dispatch),
# or reseal locally with bootstrap/kubeseal.sh. Nothing plaintext ever lands
# on disk either way.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: xool-secrets
  namespace: xool
spec:
  encryptedData:
    client-id: 
    client-secret: 
    x-bearer-token: 
    hash: 
  template:
    metadata:
      name: xool-secrets
      namespace: xool
