# Secret xool-secrets は Infisical (il.doany.io) が持ち、External Secrets Operator が
# フォルダ /xool/xool-secrets の中身をそのままキーにして作る。
# 値の変更は Infisical 側で行い、Git には何も入れない (danything/bootstrap の README 参照)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: xool-secrets
  namespace: xool
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: xool-secrets
  dataFrom:
    - find:
        path: /xool/xool-secrets
        name:
          regexp: .*
