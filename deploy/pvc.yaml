# バックアップは VolSync が PVC ごとのスナップショットを取る(danything/gitops の
# deploy/volsync/application.yaml)。SQLite は WAL なので、スナップショットから
# 自分で立ち直る。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xool-db
  namespace: xool
spec:
  # 新しく作るときは VolSync が R2 の最新から中身を埋める(volsync.yaml の xool-db-dst)。今ある PVC には効かない
  dataSourceRef:
    {
      apiGroup: volsync.backube,
      kind: ReplicationDestination,
      name: xool-db-dst,
    }
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
