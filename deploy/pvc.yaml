# バックアップは VolSync が PVC ごとのスナップショットを取る(danything/gitops の
# deploy/volsync/application.yaml)。SQLite は WAL なので、スナップショットから
# 自分で立ち直る。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xool-db
  namespace: xool
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
