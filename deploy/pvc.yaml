apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xool-db
  namespace: xool
  annotations:
    # **DB はファイルとして取らない。** Pod 側の k8up.io/backupcommand が
    # 整合したコピーを標準出力に出しているので、そちらだけで足りる。
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
