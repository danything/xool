apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xool-db
  namespace: xool
  annotations:
    # **DB はファイルとして取らない。** Pod 側の k8up.io/backupcommand が
    # 整合したコピーを標準出力に出しているので、そちらだけで足りる。
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 5Gi
---
# Hashed assets from every build that has run, shared by both pods so a
# rollout cannot serve HTML from one and 404 its chunks on the other.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xool-assets
  namespace: xool
  annotations:
    # ファイルとして k8up に取らせる(apps/k8up の Schedule が拾う)。
    # 書き換わっても部分的に古いだけで壊れない類い。
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 1Gi
